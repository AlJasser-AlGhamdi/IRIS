<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="iris-architecture-title iris-architecture-desc" id="iris-architecture-root">
      <title id="iris-architecture-title">Iris architecture</title>
      <desc id="iris-architecture-desc">A business owner works with the Iris agent, which sends verified facts to the Iris scanner to assess and protect the business systems.</desc>
      <defs>
      <style>#iris-architecture-root { --carbon: #05070a;
      --graphite: #0d1218;
      --steel: #243241;
      --white: #f4f8fb;
      --text: #c8d2dc;
      --muted: #8ea0b2;
      --cyan: #35d7ff;
      --violet: #8b83ff;
      --green: #39f0ae; }
      #iris-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #iris-architecture-root .title { fill: var(--white); font-size: 40px; font-weight: 700; }
      #iris-architecture-root .node { fill: var(--graphite); stroke: var(--steel); stroke-width: 2; }
      #iris-architecture-root .node.focal { fill: #101522; stroke: var(--violet); stroke-width: 3; }
      #iris-architecture-root .node-kicker { fill: var(--cyan); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }
      #iris-architecture-root .node-title { fill: var(--white); font-size: 20px; font-weight: 700; }
      #iris-architecture-root .node-line { fill: var(--text); font-size: 13px; }
      #iris-architecture-root .arrow { stroke: var(--cyan); stroke-width: 3; }
      #iris-architecture-root .arrow-label-bg { fill: var(--carbon); }
      #iris-architecture-root .arrow-label { fill: var(--white); font-size: 12px; font-weight: 650; }
      #iris-architecture-root .safety { fill: #0a1016; stroke-width: 1.5; }
      #iris-architecture-root .safety-title { font-size: 15px; font-weight: 700; }
      #iris-architecture-root .safety-line { fill: var(--text); font-size: 12px; }
      #iris-architecture-root .row-label { fill: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; }
      #iris-architecture-root .tech { fill: var(--graphite); stroke: var(--steel); stroke-width: 1; }
      #iris-architecture-root .tech-name { fill: var(--white); font-size: 12px; font-weight: 650; }
      #iris-architecture-root .tech-detail { fill: var(--muted); font-size: 10px; font-weight: 600; }
      @media print {
#iris-architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="iris-architecture-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L10,5 L0,10 Z" fill="#35d7ff"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#05070a"/>
      <text class="eyebrow" x="44" y="42">IRIS ARCHITECTURE</text>
      <text class="title" x="44" y="88">How Iris works</text>

      <line class="arrow" x1="214" y1="254" x2="334" y2="254" marker-end="url(#iris-architecture-arrow)"/>
      <line class="arrow" x1="594" y1="254" x2="714" y2="254" marker-end="url(#iris-architecture-arrow)"/>
      <line class="arrow" x1="884" y1="254" x2="1004" y2="254" marker-end="url(#iris-architecture-arrow)"/>
      <rect class="arrow-label-bg" x="218" y="214" width="112" height="25" rx="4"/>
      <text class="arrow-label" x="274" y="231" text-anchor="middle">answers, approvals</text>
      <rect class="arrow-label-bg" x="598" y="214" width="112" height="25" rx="4"/>
      <text class="arrow-label" x="654" y="231" text-anchor="middle">verified facts only</text>
      <rect class="arrow-label-bg" x="888" y="214" width="112" height="25" rx="4"/>
      <text class="arrow-label" x="944" y="231" text-anchor="middle">scan, fix, re-scan</text>

      <rect class="node" x="44" y="138" width="170" height="232" rx="8"/>
      <text class="node-kicker" x="68" y="174">01 · OWNER</text>
      <text class="node-title" x="68" y="212">Business owner</text>
      <text class="node-line" x="68" y="252">Chats in Arabic</text>
      <text class="node-line" x="68" y="276">or English</text>
      <text class="node-line" x="68" y="312">Answers</text>
      <text class="node-line" x="68" y="344">Approves fixes</text>

      <rect class="node focal" x="334" y="116" width="260" height="276" rx="8"/>
      <text class="node-kicker" x="358" y="152">02 · IRIS</text>
      <text class="node-title" x="358" y="190">Iris agent</text>
      <text class="node-line" x="358" y="230">Local AI model</text>
      <text class="node-line" x="358" y="254">Reads replies, picks next step</text>
      <text class="node-line" x="358" y="294">Rules engine</text>
      <text class="node-line" x="358" y="318">NCA controls, allowed actions</text>
      <text class="node-line" x="358" y="358">Audit log</text>
      <text class="tech-detail" x="570" y="376" text-anchor="end">ON THE OWNER'S MACHINE</text>

      <rect class="node" x="714" y="138" width="170" height="232" rx="8"/>
      <text class="node-kicker" x="738" y="174">03 · CHECK</text>
      <text class="node-title" x="738" y="212">Iris scanner</text>
      <text class="node-line" x="738" y="252">Proves ownership</text>
      <text class="node-line" x="738" y="288">32 security checks</text>
      <text class="node-line" x="738" y="324">Approved fixes</text>
      <text class="node-line" x="738" y="348">and re-scan</text>

      <rect class="node" x="1004" y="138" width="232" height="232" rx="8"/>
      <text class="node-kicker" x="1028" y="174">04 · BUSINESS</text>
      <text class="node-title" x="1028" y="206">The business's</text>
      <text class="node-title" x="1028" y="230">systems</text>
      <text class="node-line" x="1028" y="270">Email and DNS</text>
      <text class="node-line" x="1028" y="302">Website</text>
      <text class="node-line" x="1028" y="334">Exposed services</text>

      <text class="row-label" x="44" y="430">THREE SAFETY LAYERS</text>
      <rect class="safety" x="44" y="448" width="372" height="88" rx="8" fill="#08151a" stroke="#35d7ff"/>
      <text class="safety-title" x="68" y="480" fill="#35d7ff">Action gate</text>
      <text class="safety-line" x="68" y="510">The AI only picks allowed steps</text>
      <rect class="safety" x="436" y="448" width="372" height="88" rx="8" fill="#111025" stroke="#8b83ff"/>
      <text class="safety-title" x="460" y="480" fill="#a49eff">Typed boundary</text>
      <text class="safety-line" x="460" y="510">Website text never reaches the AI</text>
      <rect class="safety" x="828" y="448" width="408" height="88" rx="8" fill="#071711" stroke="#39f0ae"/>
      <text class="safety-title" x="852" y="480" fill="#39f0ae">Audit log</text>
      <text class="safety-line" x="852" y="510">Every step recorded</text>

      <text class="row-label" x="44" y="574">TECHNOLOGY</text>

      <g transform="translate(44 590)">
