name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --python 3.12
      - name: Publish gate
        run: uv run python scripts/public_check.py
      - name: Lint (agent code)
        run: uv run ruff check src/officer tests/officer scripts evals
      - name: Type-check (agent code)
        run: uv run mypy
      - name: Tests (engine and agent, scripted model, no lab)
        run: uv run pytest -m "not integration and not lab"
