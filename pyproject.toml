[project]
name = "compliance-officer"
version = "0.1.0"
description = "An Arabic-first AI agent that owns a Saudi SME's NCA cybersecurity compliance assessment end to end"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "AlJasser AlGhamdi" }]
dependencies = [
    # Engine (vendored p2c, see NOTICE). Pins follow the source repository.
    "compliance-trestle==4.1.0",  # OSCAL models, imported by p2c.mapping.catalog_build
    "cryptography>=45.0.0",
    "dnspython>=2.7.0",
    "httpx>=0.28.1",
    "idna>=3.18",
    "numpy>=2.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "structlog>=26.1.0",
    # Agent
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[project.scripts]
officer = "officer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2c", "src/officer"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "hypothesis>=6.155.7",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ANN", "ASYNC"]
ignore = [
    "ANN401",  # typing.Any where deliberately needed (egress hooks, JSON payloads)
    "PLR0913", # many-args (schemas)
    "PLR0917",
]

[tool.ruff.lint.pylint]
max-returns = 8
max-statements = 65

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]
"src/p2c/mapping/_arabic.py" = ["E501", "RUF001"]
"src/p2c/_embed.py" = ["RUF001"]
# Arabic prompt and template text.
"src/officer/**" = ["RUF001", "RUF003", "E501"]  # bilingual message text

[tool.ruff.lint.isort]
known-first-party = ["p2c", "officer"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/officer"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires docker services",
    "e2e: full synthetic-profile -> report pipeline",
    "sovereignty: asserts zero non-allowlisted egress",
    "lab: needs the private lab worker on the tailnet",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/p2c", "src/officer"]
branch = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["src"]
